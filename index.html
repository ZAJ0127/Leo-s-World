<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#110d1b">
  <meta name="description" content="Leo's World — private crossover relationship and activity tracker">
  <title>Leo’s World · Relationship Atlas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="Primary navigation">
      <div class="brand"><span class="brand-mark">✦</span><div><strong>LEO’S WORLD</strong><small>RELATIONSHIP ATLAS</small></div></div>
      <div class="sidebar-section">EXPLORE</div>
      <nav id="desktop-nav" class="navigation"></nav>
      <div class="sidebar-bottom"><span class="glow-dot"></span><span id="side-records">Your world, your records</span></div>
    </aside>
    <div class="app-main">
      <header class="topbar">
        <div class="top-title"><div class="eyebrow">CROSSOVER UNIVERSE / PERSONAL ARCHIVE</div><h1 id="page-title">Dashboard</h1></div>
        <div class="top-actions"><span class="mode-pill" id="mode-pill"><i></i>Snapshot</span><button class="icon-btn" id="refresh-btn" title="Refresh from connected source" aria-label="Refresh data">↻</button><button class="primary-button add-global" id="new-event-top">+ <span>Record event</span></button></div>
      </header>
      <div id="status-note" role="status" aria-live="polite"></div>
      <main id="app" tabindex="-1"></main>
    </div>
  </div>
  <nav class="mobile-nav" id="mobile-nav" aria-label="Mobile navigation"></nav>
  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="roster.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
